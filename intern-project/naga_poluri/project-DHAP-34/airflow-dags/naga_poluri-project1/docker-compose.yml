# docker-compose.yml
# Author: naga_poluri
# Project: DHAP-34
#
# Spins up Airflow + two Postgres instances:
#   - airflow-db: stores Airflow's internal metadata
#   - target-db: where the pipeline loads the CSV data (port 5433)
#
# Usage:
#   cp .env.example .env   <- fill in your values first
#   docker compose up -d
#   open http://localhost:8080  (login: admin / admin)
#   docker compose down

version: '3.8'

# common config shared by webserver and scheduler
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1-python3.11
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # pass target DB creds into containers so the DAG can use them
    PG_HOST: ${PG_HOST}
    PG_PORT: ${PG_PORT}
    PG_DB: ${PG_DB}
    PG_USER: ${PG_USER}
    PG_PASSWORD: ${PG_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../extraction:/opt/airflow/extraction
  depends_on:
    airflow-db:
      condition: service_healthy
  networks:
    - airflow-network

services:

  # internal airflow metadata database
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow_metadata_db
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - airflow-network

  # target postgres where our pipeline loads data
  # using port 5433 to avoid conflicts with any local postgres on 5432
  target-db:
    image: postgres:15-alpine
    container_name: target_postgres_db
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - target-db-data:/var/lib/postgresql/data
    networks:
      - airflow-network

  # runs once to set up the database and create the admin user
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: bash -c "pip install psycopg2-binary pandas pyyaml --quiet && airflow db migrate && airflow users create --username admin --password admin --firstname Naga --lastname Poluri --role Admin --email naga@glynac.ai"
    restart: on-failure

  # airflow web UI at http://localhost:8080
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # scheduler watches for dag changes and triggers tasks
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
    driver: local
  target-db-data:
    driver: local

networks:
  airflow-network:
    driver: bridge
